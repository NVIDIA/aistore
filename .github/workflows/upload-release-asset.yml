name: Upload GitHub Release Asset
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload the asset to'
        required: true
        type: string
      go_version:
        description: 'Exact Go version to build with (e.g. 1.27.3); empty = latest patch of the matrix go-version'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to build and upload the asset to'
        required: true
        type: string
      go_version:
        description: 'Exact Go version to build with (e.g. 1.27.3); empty = latest patch of the matrix go-version'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build and Upload CLI Release Assets
    permissions:
      contents: write
    strategy:
      matrix:
        go-version: ['1.27.x']
        os: [
          ubuntu-latest,  # for linux builds
          macos-latest,   # for macOS arm64 builds
          # macos-13,     # for macOS amd64 builds
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      # the upload script comes from the workflow's own ref; older tags lack --replace
      - name: Checkout upload script
        uses: actions/checkout@v7
        with:
          path: ci-scripts
          sparse-checkout: scripts

      # keep the nested checkout out of Go's VCS stamp (vcs.modified)
      - name: Exclude upload script from git status
        run: echo ci-scripts >> .git/info/exclude

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_version || matrix.go-version }}
          check-latest: ${{ !inputs.go_version }}

      - name: Build Binaries on ${{ matrix.os }}
        run: |
          export GOPATH="$(go env GOPATH)"
          make authn
          make cli
          make aisloader

      - name: Upload Release Asset
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ matrix.os }}
        run: |
          export GOPATH="$(go env GOPATH)"
          ./ci-scripts/scripts/github_release.sh ${{ github.event_name != 'release' && '--replace' || '' }}
