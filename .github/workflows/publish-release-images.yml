name: Publish Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to build (e.g. v1.5.1)'
        required: true
        type: string
      go_version:
        description: 'Go version for the builder image (e.g. 1.27.3); empty = Dockerfile default'
        required: false
        type: string
        default: ''
      push_latest:
        description: 'Also push the latest* image tags'
        required: false
        type: boolean
        default: false

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.tag.outputs.image_tags }}
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUSH_LATEST: ${{ github.event_name == 'push' || inputs.push_latest }}
        run: |
          tag="v${RELEASE_TAG#v1.}"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            echo "image_tags=[\"$tag\",\"latest\"]" >> $GITHUB_OUTPUT
          else
            echo "image_tags=[\"$tag\"]" >> $GITHUB_OUTPUT
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  images:
    needs: release-tag
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.release-tag.outputs.image_tags) }}
        image:
          # aisnode
          - name: aistorage/aisnode
            context_dir: deploy/prod/k8s/aisnode_container
            suffix: ''
          # aisnode tracing
          - name: aistorage/aisnode
            context_dir: deploy/prod/k8s/aisnode_container
            suffix: -oteltracing
            build_tags: oteltracing
          # aisnode ETL
          - name: aistorage/aisnode
            context_dir: deploy/prod/k8s/aisnode_container
            suffix: -etl
            build_tags: etl
          # ais-init
          - name: aistorage/ais-init
            context_dir: deploy/prod/k8s/aisinit_container
            suffix: ''
          # authn
          - name: aistorage/authn
            context_dir: deploy/prod/k8s/authn_container
            suffix: ''
          # ais-util
          - name: aistorage/ais-util
            context_dir: deploy/prod/k8s/aisutil_container
            suffix: ''
          # cluster-minimal
          - name: aistorage/cluster-minimal
            context_dir: deploy/prod/docker/image
            suffix: ''
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: ${{ matrix.image.name }}
      image_tag: ${{ matrix.tag }}${{ matrix.image.suffix }}
      context_dir: ${{ matrix.image.context_dir }}
      build_tags: ${{ matrix.image.build_tags }}
      commit_sha: ${{ needs.release-tag.outputs.commit_sha }}
      ref: ${{ inputs.release_tag }}
      extra_env: ${{ inputs.go_version && format('BUILDER_IMAGE=docker.io/library/golang:{0}', inputs.go_version) || '' }}
      multiarch: true
      pull: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
